services:
  - type: web
    name: aster-payroll-sandbox
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JUDGE_API_KEY
        sync: false
      - key: JUDGE_VERIFIED_FREE
        value: "false"
      - key: JUDGE_MODEL
        value: "gemini-3.5-flash-lite"
      - key: JUDGE_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai/"
      - key: JUDGE_MAX_TOKENS
        value: "512"
      - key: JUDGE_REASONING_EFFORT
        value: "low"
      - key: ASTER_RATE_SALT
        generateValue: true
      - key: ASTER_CALLER_JUDGE_LIMIT
        value: "100"
      - key: ASTER_GLOBAL_JUDGE_LIMIT
        value: "500"
